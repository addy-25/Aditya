<svg viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { fill: none; stroke: #30363d; stroke-width: 1; }
      .dot-r { fill: #ff5f56; }
      .dot-y { fill: #ffbd2e; }
      .dot-g { fill: #27c93f; }
      .bar { fill: #21262d; }
      .bar-txt { fill: #8b949e; font: 11px 'SF Mono', 'Fira Code', monospace; }
      .prompt { fill: #27c93f; font: 14px 'SF Mono', 'Fira Code', monospace; }
      .cmd { fill: #e6edf3; font: 14px 'SF Mono', 'Fira Code', monospace; }
      .comment { fill: #8b949e; font: 13px 'SF Mono', 'Fira Code', monospace; }
      .hi-purple { fill: #d2a8ff; font: 14px 'SF Mono', 'Fira Code', monospace; }
      .hi-blue { fill: #79c0ff; font: 14px 'SF Mono', 'Fira Code', monospace; }
      .hi-green { fill: #7ee787; font: 14px 'SF Mono', 'Fira Code', monospace; }
      .hi-orange { fill: #ffa657; font: 14px 'SF Mono', 'Fira Code', monospace; }
      .cursor {
        fill: #e6edf3;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

      .line1 { opacity: 0; animation: appear .01s .3s forwards; }
      .line2 { opacity: 0; animation: appear .01s .9s forwards; }
      .line3 { opacity: 0; animation: appear .01s 1.5s forwards; }
      .line4 { opacity: 0; animation: appear .01s 2.0s forwards; }
      .line5 { opacity: 0; animation: appear .01s 2.5s forwards; }
      @keyframes appear { to { opacity: 1; } }
    </style>
  </defs>

  <!-- Terminal window -->
  <rect width="800" height="160" rx="10" class="bg"/>
  <rect width="800" height="160" rx="10" class="border"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="30" rx="10" class="bar"/>
  <rect x="0" y="20" width="800" height="10" class="bar"/>
  <circle cx="20" cy="15" r="5" class="dot-r"/>
  <circle cx="40" cy="15" r="5" class="dot-y"/>
  <circle cx="60" cy="15" r="5" class="dot-g"/>
  <text x="385" y="19" text-anchor="middle" class="bar-txt">aditya@dev: ~/portfolio</text>

  <!-- Line 1 -->
  <g class="line1">
    <text x="20" y="56" class="prompt">❯ </text>
    <text x="52" y="56" class="cmd">whoami</text>
  </g>

  <!-- Line 2 -->
  <g class="line2">
    <text x="20" y="76" class="hi-purple">Aditya Singh</text>
    <text x="130" y="76" class="comment"> // backend engineer · agentic AI · MCP server builder</text>
  </g>

  <!-- Line 3 -->
  <g class="line3">
    <text x="20" y="96" class="prompt">❯ </text>
    <text x="52" y="96" class="cmd">cat </text>
    <text x="84" y="96" class="hi-orange">status.json</text>
  </g>

  <!-- Line 4 -->
  <g class="line4">
    <text x="20" y="116" class="comment">{ </text>
    <text x="44" y="116" class="hi-blue">"role"</text>
    <text x="98" y="116" class="comment">: </text>
    <text x="114" y="116" class="hi-green">"final-year CSE @ VIT Bhopal"</text>
    <text x="400" y="116" class="comment">,  </text>
    <text x="424" y="116" class="hi-blue">"open_to"</text>
    <text x="504" y="116" class="comment">: </text>
    <text x="520" y="116" class="hi-green">"SDE · AI roles"</text>
    <text x="660" y="116" class="comment"> }</text>
  </g>

  <!-- Line 5 with cursor -->
  <g class="line5">
    <text x="20" y="140" class="prompt">❯ </text>
    <rect x="52" y="127" width="9" height="15" class="cursor"/>
  </g>
</svg>
